version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./storage/uploads:/app/uploads
    container_name: helpdesk-backend
    # ให้รับ request แค่จากเครื่อง host (Nginx จะมาเรียก)
    #ports:
    #  - "127.0.0.1:3000:3000"
    network_mode: host
    environment:
      - TZ=Asia/Bangkok
      # ฝั่ง backend ใช้ URL นี้ตอน redirect / CORS
      - FRONTEND_URL=https://itsupport.sru.ac.th

      # === Google OAuth ===
      - GOOGLE_CLIENT_ID=${PROD_GOOGLE_CLIENT_ID:?Set PROD_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${PROD_GOOGLE_CLIENT_SECRET:?Set PROD_GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://itsupport.sru.ac.th/auth/google/redirect
      # GOOGLE_CALLBACK_URL=http://localhost:3000/auth/google/redirect

      - NODE_ENV=production
      - COOKIE_SECURE=true
      - SESSION_SECRET=${PROD_SESSION_SECRET:?Set PROD_SESSION_SECRET}
      - TRUST_PROXY=loopback
      - HOST=127.0.0.1
      - JWT_SECRET=${PROD_JWT_SECRET:?Set PROD_JWT_SECRET}
      - JWT_EXPIRES_IN=7d

      # DB connection (ใช้ service name db)
      - DATABASE_HOST=127.0.0.1
      - DATABASE_PORT=3306
      - DATABASE_USER=itsupport_user
      - DATABASE_PASSWORD=${PROD_DATABASE_PASSWORD:?Set PROD_DATABASE_PASSWORD}
      - DATABASE_NAME=itsupport_db

      # === SMTP Email ===
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_USER=software.dev@sru.ac.th
      - SMTP_PASS=${PROD_SMTP_PASS:?Set PROD_SMTP_PASS}
      - SMTP_FROM=software.dev@sru.ac.th

      # === Telegram ===
      - TELEGRAM_BOT_TOKEN=${PROD_TELEGRAM_BOT_TOKEN:?Set PROD_TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=-4828646624

    restart: unless-stopped
    command: >
      sh -c "
        node dist/seeds/seed-roles.js &&
        node dist/main.js
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://itsupport.sru.ac.th/api
    container_name: helpdesk-frontend
    # เปิดให้ Nginx บน host ยิงเข้าเท่านั้น
    ports:
      - "127.0.0.1:8082:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

